[package]
name = "ytnef-cli"
description = "ytnef and ytnefprint command-line tools (Rust port)"
keywords = ["tnef", "winmail", "outlook", "email", "cli"]
categories = ["command-line-utilities", "email"]
include = ["src/**/*.rs", "man/*.1", "LICENSE", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true

[[bin]]
name = "ytnef"
path = "src/bin/ytnef.rs"

[[bin]]
name = "ytnefprint"
path = "src/bin/ytnefprint.rs"

[dependencies]
ytnef-core.workspace = true
ytnef-export.workspace = true

[lints]
workspace = true
