[package]
name = "ytnef-capi"
description = "Drop-in C ABI for libytnef.so.0, backed by ytnef-core"
keywords = ["tnef", "winmail", "libytnef", "ffi", "cargo-c"]
categories = ["external-ffi-bindings", "email"]
include = ["src/**/*.rs", "include/*.h", "build.rs", "libytnef0.symbols", "LICENSE", "README.md"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
name = "ytnef"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
# Marker cargo-c requires; enables nothing.
capi = []

[dependencies]
libc = "0.2"
ytnef-core.workspace = true

# cargo-c (`cargo cinstall`): libytnef.so.0 + libytnef.pc + the original headers.
[package.metadata.capi.library]
name = "ytnef"
version_suffix_components = 1

[package.metadata.capi.header]
generation = false
subdirectory = false

[package.metadata.capi.pkg_config]
name = "libytnef"
filename = "libytnef"
description = "Yerase's TNEF Stream Reader library"
# The C library version this ABI matches, not the crate version.
version = "2.1.4"

[package.metadata.capi.install.include]
asset = [{ from = "include/*.h", to = "" }]

[lints.rust]
# The one crate allowed `unsafe`: the C ABI cannot be written without it.
unsafe_code = "allow"
