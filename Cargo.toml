[workspace]
resolver = "2"
members = ["crates/ytnef-core", "crates/ytnef-export", "crates/ytnef-cli", "crates/ytnef-capi"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-2.0-or-later"
repository = "https://github.com/Yeraze/ytnef-rust"
readme = "README.md"
authors = ["Randall Hand"]

# Inter-crate pins: bump these together with workspace.package.version.
[workspace.dependencies]
ytnef-core = { path = "crates/ytnef-core", version = "0.1.0" }
ytnef-export = { path = "crates/ytnef-export", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
overflow-checks = true
