[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
# GPL-2.0-or-later is our own crates; the rest is what dependencies use.
allow = ["GPL-2.0-or-later", "MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
