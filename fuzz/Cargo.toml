[package]
name = "ytnef-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ytnef-core = { path = "../crates/ytnef-core" }

# Not part of the main workspace: needs nightly (`cargo +nightly fuzz run <target>`).
[workspace]

[[bin]]
name = "decompress_rtf"
path = "fuzz_targets/decompress_rtf.rs"
test = false
doc = false
bench = false
